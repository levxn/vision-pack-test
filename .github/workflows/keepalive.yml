# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. Re-enabling an already enabled workflow through
# the API resets that timer, so this job does exactly that once a month, for
# the nightly and for itself. Runs on a GitHub-hosted runner.
name: keepalive

on:
  schedule:
    - cron: "11 3 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in nightly.yml keepalive.yml; do
            gh workflow enable "${wf}" -R "${REPO}"
            echo "re-enabled ${wf}"
          done
