# actionlint config: https://github.com/rhysd/actionlint/blob/main/docs/config.md
self-hosted-runner:
  # Labels runner/setup.sh registers on the dedicated GPU host (see runner/README.md).
  labels:
    - vp-gpu
    - vp-cpu

# nightly.yml, image.yml and keepalive.yml have their trigger intentionally
# commented out (see the "TEMPORARILY DISABLED" note at the top of each)
# until a self-hosted runner is available and the pipeline is ready to run
# unattended. actionlint still parses every file under .github/workflows, so
# a workflow with no "on:" fails schema validation, and with nightly.yml's
# workflow_dispatch inputs invisible, every `inputs.*` reference becomes
# unresolvable too. Both are expected while disabled. Remove the matching
# entry below in the same change that restores each workflow's trigger.
paths:
  .github/workflows/nightly.yml:
    ignore:
      - '"on" section is missing in workflow'
      - 'property ".+" is not defined in object type'
  .github/workflows/image.yml:
    ignore:
      - '"on" section is missing in workflow'
  .github/workflows/keepalive.yml:
    ignore:
      - '"on" section is missing in workflow'
